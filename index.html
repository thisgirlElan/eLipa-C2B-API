<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form id="paymentForm">
      <label for="amount">Amount:</label>
      <input
        type="text"
        id="amount"
        name="amount"
        value=""
        required
      /><br /><br />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" value="" /><br /><br />

      <label for="phone">Phone:</label>
      <input
        type="text"
        id="phone"
        name="phone"
        value=""
        required
      /><br /><br />

      <div id="container">
        <button type="submit" id="pgwButton">Pay with Gateway</button>
        <button type="submit" id="vaButton">Pay with Virtual Account</button>
      </div>
    </form>

    <div id="va-modal" class="va-modal hidden">
      <div class="va-modal-content">
        <h2>Bank Transfer Details</h2>
        <p>
          <strong>Account Name:</strong> <span id="va-account-name"></span>
        </p>
        <p><strong>Bank Name:</strong> <span id="va-bank-name"></span></p>
        <p>
          <strong>Account Number:</strong>
          <span id="va-account-number"></span>
          <button
            class="copy-btn"
            onclick="copyToClipboard('va-account-number')"
          >
            Copy
          </button>
        </p>
        <p><strong>Amount:</strong> <span id="va-amount"></span></p>
        <button onclick="closeVAModal()">Close</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
